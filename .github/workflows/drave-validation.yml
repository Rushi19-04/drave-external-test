name: DRAVE Validation

on:
  push:
    paths:
      - 'detections/**'
      - '.github/workflows/drave-validation.yml'
  pull_request:
    paths:
      - 'detections/**'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Run in bootstrap mode'
        required: false
        default: 'false'

jobs:
  validate-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run DRAVE Detection Validation
        id: drave_validation
        continue-on-error: true
        uses: Rushi19-04/DRAVE/action/drave-action-repo@main
        with:
          api-url: https://drave-bfsi.onrender.com
          rule-paths: detections
          api-key: ${{ secrets.DRAVE_API_KEY }}
          bootstrap: ${{ github.event.inputs.bootstrap || 'true' }}

      - name: Save logs to file
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add api_sync_*.log
          git commit -m "Add API sync logs"
          git push
