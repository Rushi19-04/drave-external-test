name: DRAVE Validation

on:
  push:
    paths:
      - 'detections/**'
      - '.github/workflows/drave-validation.yml'
  pull_request:
    paths:
      - 'detections/**'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Run in bootstrap mode'
        required: false
        default: 'false'

jobs:
  validate-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch E2E Results
        env:
          API_KEY: ${{ secrets.DRAVE_API_KEY }}
        run: |
          cat << 'EOF' > fetch_e2e.py
          import urllib.request, json, os
          url_validations = 'https://drave-bfsi.onrender.com/api/v1/validations'
          url_rules = 'https://drave-bfsi.onrender.com/api/v1/rules'
          headers = {'X-API-Key': os.environ['API_KEY']}
          
          try:
              req_v = urllib.request.Request(url_validations, headers=headers)
              res_v = urllib.request.urlopen(req_v)
              validations = json.loads(res_v.read())
              
              req_r = urllib.request.Request(url_rules, headers=headers)
              res_r = urllib.request.urlopen(req_r)
              rules = json.loads(res_r.read())
              
              with open('e2e_results.md', 'w') as f:
                  f.write(f"# E2E Results\n\n")
                  f.write(f"- ValidationRuns created: {len(validations)}\n")
                  f.write(f"- Rules visible on dashboard: {len(rules)}\n")
          except Exception as e:
              with open('e2e_results.md', 'w') as f:
                  f.write(str(e))
          EOF
          python fetch_e2e.py
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add e2e_results.md
          git commit -m "Capture E2E results"
          git push

      - name: Run DRAVE Detection Validation
        id: drave_validation
        continue-on-error: true
        uses: Rushi19-04/DRAVE/action/drave-action-repo@main
        with:
          api-url: https://drave-bfsi.onrender.com
          rule-paths: detections
          api-key: ${{ secrets.DRAVE_API_KEY }}
          bootstrap: ${{ github.event.inputs.bootstrap || 'true' }}

