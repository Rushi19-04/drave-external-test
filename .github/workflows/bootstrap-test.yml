name: DRAVE Bootstrap E2E Test

on:
  push:
    branches:
      - main

jobs:
  bootstrap-test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch BEFORE E2E Results
        env:
          API_KEY: ${{ secrets.DRAVE_API_KEY }}
        run: |
          cat << 'PYEOF' > fetch_e2e.py
          import urllib.request, json, os, time
          url_validations = 'https://drave-bfsi.onrender.com/api/v1/validations'
          url_rules = 'https://drave-bfsi.onrender.com/api/v1/rules'
          headers = {'X-API-Key': os.environ['API_KEY']}
          try:
              res_v = urllib.request.urlopen(urllib.request.Request(url_validations, headers=headers))
              validations_before = len(json.loads(res_v.read()))
              res_r = urllib.request.urlopen(urllib.request.Request(url_rules, headers=headers))
              rules_before = len(json.loads(res_r.read()))
              with open('bootstrap_e2e_results.md', 'w') as f:
                  f.write(f"# Final E2E Results\n\n## Before\n- ValidationRuns: {validations_before}\n- Rules: {rules_before}\n\n")
          except Exception as e:
              with open('bootstrap_e2e_results.md', 'w') as f: f.write(str(e))
          PYEOF
          python fetch_e2e.py

      - name: Run DRAVE Detection Validation
        id: drave_validation
        uses: Rushi19-04/DRAVE/action/drave-action-repo@v1
        with:
          api-url: https://drave-bfsi.onrender.com
          rule-paths: detections
          api-key: ${{ secrets.DRAVE_API_KEY }}
          bootstrap: 'true'

      - name: Fetch AFTER E2E Results
        if: always()
        env:
          API_KEY: ${{ secrets.DRAVE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'PYEOF' > fetch_e2e_after.py
          import urllib.request, json, os, time
          time.sleep(5)
          url_validations = 'https://drave-bfsi.onrender.com/api/v1/validations'
          url_rules = 'https://drave-bfsi.onrender.com/api/v1/rules'
          headers = {'X-API-Key': os.environ['API_KEY']}
          try:
              res_v = urllib.request.urlopen(urllib.request.Request(url_validations, headers=headers))
              validations_after = len(json.loads(res_v.read()))
              res_r = urllib.request.urlopen(urllib.request.Request(url_rules, headers=headers))
              rules_after = len(json.loads(res_r.read()))
              with open('bootstrap_e2e_results.md', 'a') as f:
                  f.write(f"## After\n- ValidationRuns: {validations_after}\n- Rules: {rules_after}\n")
          except Exception as e:
              with open('bootstrap_e2e_results.md', 'a') as f: f.write(str(e))
          PYEOF
          python fetch_e2e_after.py
          gh issue create --title "E2E Results" --body-file bootstrap_e2e_results.md
